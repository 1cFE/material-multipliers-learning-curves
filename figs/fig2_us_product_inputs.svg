<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<rect width="1000" height="600" fill="white"/>
<text x="100" y="29" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" fill="#586777" text-anchor="start">FIGURE 2  /  SOURCED EXAMPLES</text>
<text x="100" y="67" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#18354A" text-anchor="start">Cost and material inputs in two US products</text>
<text x="100" y="95" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#586777" text-anchor="start">Separate panels preserve the different accounting boundaries</text>
<polyline points="500.000,134.000 500.000,532.000" fill="none" stroke="#E2E7EB" stroke-width="1"/>
<text x="70" y="150" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#18354A" text-anchor="start">Mass-produced passenger car</text>
<text x="70" y="176" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#586777" text-anchor="start">US Department of Energy assessment · 2012</text>
<text x="70" y="199" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">Dollars per pound of vehicle</text>
<text x="70" y="241" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Selling price</text>
<text x="465" y="241" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#176A8A" text-anchor="end">$8.00/lb</text>
<rect x="70" y="255" width="395" height="23" fill="#176A8A"/>
<text x="70" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Raw-material value</text>
<text x="465" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#176A8A" text-anchor="end">$0.60/lb</text>
<rect x="70" y="326" width="29.625" height="23" fill="#176A8A"/>
<text x="70" y="408" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#176A8A" text-anchor="start">≈ 13×</text>
<text x="70" y="438" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Selling price ÷ raw-material value</text>
<text x="70" y="466" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">Raw-material estimate covers the car&#x27;s material mix.</text>
<text x="70" y="488" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">Selling price includes distribution and margins.</text>
<text x="70" y="523" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#586777" text-anchor="start">Source: DOE technology assessments, p. 25.</text>
<text x="535" y="150" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#18354A" text-anchor="start">Single-family house construction</text>
<text x="535" y="176" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#586777" text-anchor="start">US construction estimate cited by Potter · 2026</text>
<text x="535" y="199" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">Index: hard construction cost = 100</text>
<text x="535" y="241" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Hard construction cost</text>
<text x="930" y="241" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#66794B" text-anchor="end">100</text>
<rect x="535" y="255" width="395" height="23" fill="#66794B"/>
<text x="535" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Purchased building inputs</text>
<text x="930" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" fill="#66794B" text-anchor="end">≈ 50</text>
<rect x="535" y="326" width="197.5" height="23" fill="#66794B"/>
<text x="535" y="408" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#66794B" text-anchor="start">≈ 2×</text>
<text x="535" y="438" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#18354A" text-anchor="start">Construction cost ÷ purchased inputs</text>
<text x="535" y="466" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">Inputs include finished materials and components.</text>
<text x="535" y="488" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586777" text-anchor="start">This is not a raw-material ratio. Land is excluded.</text>
<text x="535" y="523" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#586777" text-anchor="start">Source: Potter, citing Craftsman&#x27;s cost estimator.</text>
<text x="70" y="578" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#586777" text-anchor="start">Different cost and input boundaries. Neither ratio measures removable cost.</text>
</svg>
